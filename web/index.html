<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.svg">
<meta property="og:title" content="RAD DRIFT">
<meta property="og:description" content="A fast top-down arena roguelite, written in no-libc Zig and compiled to WebAssembly. Auto-fire, dash through enemies, stack perks.">
<meta property="og:image" content="https://moai-heads.github.io/raddrift/icon.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07080d"><title>RAD DRIFT — a neon arena roguelite</title>
<meta name="description" content="RAD DRIFT: a fast top-down arena roguelite written in no-libc Zig, compiled to WebAssembly.">
<style>
  :root{--bg:#07080d;--ink:#e8f2ff;--dim:#7f8ea3;--neon:#66f0ff;--gold:#ffc14d;--pink:#ff33cc}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,#0c1220 0%,#07080d 60%);color:var(--ink);
       font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;
       align-items:center;justify-content:center;min-height:100%;padding:18px;gap:14px}
  h1{font-size:clamp(18px,3.4vw,30px);letter-spacing:.34em;font-weight:700;text-transform:uppercase;
     color:var(--neon);text-shadow:0 0 22px rgba(102,240,255,.55)}
  h1 b{color:var(--gold);text-shadow:0 0 22px rgba(255,193,77,.5)}
  .stage{position:relative;width:min(96vw,1120px);aspect-ratio:16/9;border-radius:10px;overflow:hidden;
         box-shadow:0 0 0 1px #1b2740,0 0 60px rgba(60,120,255,.18),0 30px 70px rgba(0,0,0,.55);background:#000}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#05060b}
  .scan{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
        background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px)}
  .vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(120% 120% at 50% 50%,transparent 52%,rgba(0,0,0,.62) 100%)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .k{font-size:12px;letter-spacing:.12em;color:var(--dim)}
  .k b{color:var(--ink);background:#141c2b;border:1px solid #22304f;border-radius:5px;padding:2px 7px;margin-right:4px;color:var(--neon)}
  button{font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
         background:#111a2a;border:1px solid #24324f;border-radius:7px;padding:8px 14px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 18px rgba(102,240,255,.25)}
  .foot{font-size:11px;color:#4c5a70;letter-spacing:.1em;text-align:center;max-width:720px;line-height:1.7}
  .foot a{color:var(--dim)}
</style>
</head>
<body>
  <h1>RAD <b>DRIFT</b></h1>
  <div class="stage">
    <canvas id="c" width="480" height="270"></canvas>
    <div class="scan"></div>
    <div class="vig"></div>
  </div>
  <div class="row">
    <span class="k"><b>WASD</b>move</span>
    <span class="k"><b>SPACE</b>dash (damages foes)</span>
    <span class="k"><b>1 2 3</b>pick perk</span>
    <span class="k"><b>R</b>retry</span>
    <button id="mute">sound: on</button>
    <button id="full">fullscreen</button>
  </div>
  <div class="foot">
    auto-fire at the nearest hostile · don't overheat your gun · dash through enemies to shred them ·<br>
    collect shards, level up, stack perks · survive waves and the OVERSEER.
  </div>
  <script src="game.js"></script>
</body>
</html>
